name: Site guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit public pages and repository boundaries
        run: python3 ops/site_ops.py audit .
      - name: Run site operations tests
        run: python3 -m unittest discover -s tests
